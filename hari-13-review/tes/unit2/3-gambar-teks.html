<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Welcome to Bali</title>
    <style>
      .banner {
        position: relative;
        width: 800px;
        max-width: 100%;
      }
      .banner img {
        display: block;
        width: 100%;
      }
      .banner p {
        position: absolute;
        left: 0;
        bottom: 40%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <img src="pantaibali.jpg" alt="Pantai Bali" />
      <p>Welcome to bali</p>
    </div>
  </body>
</html>
