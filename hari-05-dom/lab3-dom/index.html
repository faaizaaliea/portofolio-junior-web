<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter dan Daftar Tugas</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <h1>Lab 3 - DOM dan Event</h1>

      <section aria-labelledby="judul-counter">
        <h2 id="judul-counter">Counter</h2>
        <p id="angka" class="angka" aria-live="polite">0</p>
        <button id="tambah" type="button">Tambah</button>
        <button id="kurang" type="button">Kurang</button>
        <button id="reset" type="button">Reset</button>
      </section>

      <section aria-labelledby="judul-tugas">
        <h2 id="judul-tugas">Daftar Tugas</h2>
        <form id="form-tugas">
          <label for="teks-tugas">Tugas baru (maksimal 80 karakter)</label>
          <input id="teks-tugas" maxlength="80" autocomplete="off" required />
          <button type="submit">Tambah</button>
        </form>
        <p id="sisa" aria-live="polite">Tugas tersisa: 0</p>
        <ul id="daftar-tugas"></ul>
      </section>
    </main>
    <script src="js/app.js"></script>
  </body>
</html>
